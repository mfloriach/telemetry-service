root = "."
tmp_dir = "tmp"

[build]
  args_bin = []
  entrypoint = "./tmp/telemetry-server"
  cmd = "go build -o ./tmp/telemetry-server ./cmd/telemetry-server"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "docs", "openspec", ".git", ".github", ".opencode"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "sh -c 'if [ -f .env ]; then set -a; . ./.env; set +a; fi; exec ./tmp/telemetry-server'"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[proxy]
  app_port = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
