version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
    - depguard

  settings:
    depguard:
      rules:
        internal-only-stdlib:
          files:
            - "**/internal/**/*.go"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            - server/internal
            - 'github.com/go-playground/validator/v10'
            - 'github.com/ilyakaznacheev/cleanenv'

        no-internal-dependencies:
          files:
            - "**/internal/**/*.go"
            - "!$test"
          list-mode: lax
          deny:
            - pkg: "server/pkg"
              desc: "Internal packages must not depend on pkg."

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0


